# Generic repro runner: checks out the dispatched branch and runs
# its root ./repro.sh, passing the exit code through. Nothing in
# this file is repro-specific — all behavior lives on the branch.
# (Inverted semantics: nonzero job = bug manifested. See README.)
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Repro branch to run (must carry executable repro.sh at root)'
        required: true
        default: 'mkl/vml-sqrt-sigill-ivy-bridge'
      timeout_min:
        description: 'Job wall-clock budget in minutes'
        default: '340'

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_min) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.branch }}
      - name: Check repro contract
        run: |
          test -x repro.sh || { echo "CONTRACT-FAILED: no executable root repro.sh on branch ${{ inputs.branch }}"; exit 2; }
          test -f README.md || { echo "CONTRACT-FAILED: no root README.md on branch ${{ inputs.branch }}"; exit 2; }
      - name: Run repro
        run: ./repro.sh
